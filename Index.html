<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CelestialTECH | Mobilite ve Enerji Sistemleri</title>
<style>
:root{--navy:#0b192c;--n2:#1e3e62;--bl:#00b4ff;--gr:#2ee6a6;--bg:#fff;--bg2:#eef2f7;--tx:#14202f;--mu:#566678;--cd:#fff;--ln:#d3dbe6;--hb:rgba(255,255,255,.96);--lk:#0b6fa8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#08121f;--bg2:#0d1c30;--tx:#e8eef6;--mu:#9fb0c4;--cd:#112440;--ln:#1f3856;--hb:rgba(8,18,31,.96);--lk:#4cc9ff}}
:root[data-theme=dark]{--bg:#08121f;--bg2:#0d1c30;--tx:#e8eef6;--mu:#9fb0c4;--cd:#112440;--ln:#1f3856;--hb:rgba(8,18,31,.96);--lk:#4cc9ff}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:calc(76px + env(safe-area-inset-top,0px))}
body{font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--tx);line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hb);z-index:60}
:focus-visible{outline:3px solid var(--bl);outline-offset:2px}
.w{max-width:1200px;margin:auto;padding:0 20px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--hb);backdrop-filter:blur(8px);border-bottom:1px solid var(--ln);transition:box-shadow .3s}
header.sh{box-shadow:0 4px 18px rgba(0,0,0,.18)}
.hr{display:flex;align-items:center;justify-content:space-between;height:68px;gap:14px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:1.3rem;color:var(--tx);text-decoration:none}
.logo b{color:var(--lk)}.logo svg{color:var(--bl);width:26px;height:26px}
nav{display:flex;gap:2px}
nav a{padding:8px 12px;color:var(--tx);text-decoration:none;font-size:.92rem;font-weight:600;border-bottom:2px solid transparent}
nav a:hover,nav a.on{color:var(--lk);border-color:var(--bl)}
.tl{display:flex;gap:8px}
.ib{background:none;border:1px solid var(--ln);color:var(--tx);border-radius:4px;height:36px;min-width:36px;padding:0 10px;cursor:pointer;font:inherit;font-size:.82rem;display:flex;align-items:center;justify-content:center;gap:4px}
.ib:hover{border-color:var(--bl);color:var(--lk)}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#bm{display:none}
@media(max-width:900px){#bm{display:flex}nav{position:absolute;top:100%;left:0;right:0;background:var(--bg);flex-direction:column;padding:8px 20px;border-bottom:1px solid var(--ln);display:none}nav.on{display:flex}}
#home{position:relative;min-height:88vh;display:flex;align-items:center;color:#fff;background:radial-gradient(circle at 78% 18%,#1e3e62,#0b192c 66%);overflow:hidden}
#home::before{content:"";position:absolute;inset:0;background:linear-gradient(rgba(0,180,255,.08) 1px,transparent 1px) 0 0/48px 48px,linear-gradient(90deg,rgba(0,180,255,.08) 1px,transparent 1px) 0 0/48px 48px}
#cv{position:absolute;inset:0;width:100%;height:100%}
.hc{position:relative;max-width:780px;padding:60px 0}
